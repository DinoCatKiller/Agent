[workspace]
resolver = "3"
members = [
    # 契约与纯类型（无 IO）
    "crates/common",
    # 基础设施：被 features 复用
    "crates/kernel/*",
    # 用户可见功能：一个功能一个文件夹（D5）
    "crates/features/*",
    # 二进制入口
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# 与后续 UI 层对齐：gpui-kit 需要 ≥1.95（见 `X2`）
rust-version = "1.95"

[workspace.dependencies]
# 内部 crate
agent-common = { path = "crates/common" }
agent-providers = { path = "crates/kernel/providers" }
agent-transport = { path = "crates/kernel/transport" }
agent-store = { path = "crates/kernel/store" }
agent-chat = { path = "crates/features/chat" }

# 外部依赖：只加「这一阶段真的用得上」的，见 `X1`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
# 流式装配：适配器把「请求 → 字节流 → SSE → 归一化事件」拼成一条 EventStream（M3 用）
async-stream = "0.3"
# 与 reqwest 的字节流类型一致（reqwest 亦依赖它，无新增传递成本）
bytes = "1"
# rustls：无 OpenSSL 依赖，交叉编译友好；stream 用于 bytes_stream，json 供上层复用
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# rt-multi-thread + macros：异步入口；time：超时/退避；sync：通知原语；signal：Ctrl-C 取消（M4 REPL）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
# 本地存储（`X1` §1）：单机桌面无连接池；bundled 免装 SQLite（需 C 编译器）
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
