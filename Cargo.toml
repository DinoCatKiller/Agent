[workspace]
resolver = "3"
members = [
    # 契约与纯类型（无 IO）
    "crates/common",
    # 基础设施：被 features 复用
    "crates/kernel/*",
    # 用户可见功能：一个功能一个文件夹（D5）
    "crates/features/*",
    # 二进制入口
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# 与后续 UI 层对齐：gpui-kit 需要 ≥1.95（见 `X2`）
rust-version = "1.95"

[workspace.dependencies]
# 内部 crate
agent-common = { path = "crates/common" }
agent-providers = { path = "crates/kernel/providers" }

# 外部依赖：只加「这一阶段真的用得上」的，见 `X1`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
# rustls：无 OpenSSL 依赖，交叉编译友好；stream 用于 bytes_stream，json 供上层复用
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
