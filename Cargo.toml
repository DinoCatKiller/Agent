[workspace]
resolver = "3"
members = [
    "crates/agent-schema",
    "crates/agent-providers",
    "crates/agent-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# 与后续 UI 层对齐：gpui-kit 需要 ≥1.95（见 docs/40-research/gpui-frontend-stack.md）
rust-version = "1.95"

[workspace.dependencies]
# 内部 crate
agent-schema = { path = "crates/agent-schema" }
agent-providers = { path = "crates/agent-providers" }

# 外部依赖：只加「这一阶段真的用得上」的，见 docs/40-research/rust-backend-stack.md
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
