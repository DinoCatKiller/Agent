[package]
name = "agent-app"
description = "二进制入口：组装依赖、承载 CLI 命令（业务在 features/*）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
# 可执行文件名（面向用户）：`codingrocket`。crate **包名**仍是 `agent-app`（内部技术名，S2 Q7），
# 因此 `cargo run -p agent-app -- …` 不受影响。
name = "codingrocket"
path = "src/main.rs"

[features]
# 二期 GUI（`D3` 方案 A）：GPUI 窗口子命令 `gui`。**默认关闭**——
# 一期 TUI 产物不该为尚未完成的 GUI 背上 GPUI 的依赖树与体积（`S2` Q6 的 ≤30MB）。
# 门禁要跑 `--all-features`，否则这条分支不会被检查（`Q1` §5）。
gui = ["agent-chat/gui", "dep:agent-ui-kit"]

[dependencies]
agent-chat = { workspace = true }
# 二期 GUI 的组件层（可选：只有 `gui` feature 才拉进来）
agent-ui-kit = { workspace = true, optional = true }
agent-common = { workspace = true }
agent-config = { workspace = true }
agent-providers = { workspace = true }
agent-routing = { workspace = true }
agent-telemetry = { workspace = true }
agent-sessions = { workspace = true }
agent-store = { workspace = true }
agent-transport = { workspace = true }
# CLI 参数解析与 REPL 行编辑（`X6` A1 / A2）：终端生命周期归二进制入口
clap = { workspace = true }
rustyline = { workspace = true }
# 一期 TUI（`D3`）：crossterm 事件泵在 app（终端生命周期归二进制入口），渲染在 features/*
crossterm = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
# 端到端：真实 HTTP 栈（reqwest → wiremock 假服务器），断网可测（Q1 §1）
wiremock = "0.6"
