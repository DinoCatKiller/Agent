[package]
name = "agent-routing"
description = "机制内核 routing：模型注册表查询、能力协商与失败降级链"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-common = { workspace = true }
agent-providers = { workspace = true }
# `A6`：路由层复用 transport 的退避策略与退避序列器（策略层 → 机制层，只能向下）
agent-transport = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }

[dev-dependencies]
# test-util 提供 tokio::time::pause()，重试测试用它跳过退避等待（Q1 §4）
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
